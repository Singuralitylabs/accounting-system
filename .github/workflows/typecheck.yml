name: TypeScript Type Check

# 型安全性と静的品質の早期検出（docs/testing.md 3.3 / 3.5）
# Lint には no-console / no-debugger ルールが含まれるため、
# デバッグ出力検知（docs/testing.md 4.2 の Check console.log and debugger）も本ワークフローが兼ねる。
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "middleware.ts"
      - "tsconfig.json"
      - ".eslintrc.json"
      - "package.json"
      - "yarn.lock"
  pull_request:
    paths:
      - "app/**"
      - "middleware.ts"
      - "tsconfig.json"
      - ".eslintrc.json"
      - "package.json"
      - "yarn.lock"
  workflow_dispatch:

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Type check
        run: yarn typecheck

  lint:
    name: ESLint (incl. no-console / no-debugger)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Lint
        run: yarn lint
