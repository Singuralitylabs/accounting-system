name: TypeScript Type Check

# Lint includes no-console / no-debugger, so this workflow also covers debug-output detection.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "middleware.ts"
      - "tsconfig.json"
      - ".eslintrc.json"
      - "package.json"
      - "yarn.lock"
  pull_request:
    paths:
      - "app/**"
      - "middleware.ts"
      - "tsconfig.json"
      - ".eslintrc.json"
      - "package.json"
      - "yarn.lock"
  workflow_dispatch:
  # Reused by the release-PR quality gate (release-pr.yml).
  workflow_call:

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Type check
        run: yarn typecheck

  lint:
    name: ESLint (incl. no-console / no-debugger)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Lint
        run: yarn lint
