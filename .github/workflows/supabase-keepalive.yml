name: Supabase Keep-Alive

# Supabase 無料プランの自動 Pause（1 週間アクセスが無いとプロジェクトが一時停止される）を防ぐため、
# 開発用・本番用の両プロジェクトに 1 日 1 回 PostgREST 経由の軽い SELECT を送る（Issue #125）。
# 仕組み・必要な GitHub Secrets・停止手順は docs/setup.md の「Supabase keep-alive」を参照。
#
# 注意:
# - schedule トリガーはデフォルトブランチ（main）上のワークフロー定義でのみ動く。
# - Auth API の /auth/v1/health は DB アクティビティとして数えられない可能性があるため、
#   RLS で anon に読める select_options テーブルへ REST（PostgREST）で問い合わせる。
on:
  schedule:
    # 毎日 06:17 JST（21:17 UTC）。Vercel Cron（00:00 UTC）とは時間帯をずらし、
    # GitHub Actions の schedule が最も遅延・スキップされやすい「毎時 0 分」も避けている
    - cron: "17 21 * * *"
  workflow_dispatch:

# checkout も行わないため GITHUB_TOKEN に権限は一切与えない
permissions: {}

jobs:
  keepalive:
    name: keep-alive (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      # 片方が失敗してももう片方には必ずリクエストを送る
      fail-fast: false
      matrix:
        include:
          - target: dev
            url_secret: KEEPALIVE_SUPABASE_URL_DEV
            anon_key_secret: KEEPALIVE_SUPABASE_ANON_KEY_DEV
          - target: prod
            url_secret: KEEPALIVE_SUPABASE_URL_PROD
            anon_key_secret: KEEPALIVE_SUPABASE_ANON_KEY_PROD
    env:
      TARGET: ${{ matrix.target }}
      URL_SECRET_NAME: ${{ matrix.url_secret }}
      ANON_KEY_SECRET_NAME: ${{ matrix.anon_key_secret }}
      SUPABASE_URL: ${{ secrets[matrix.url_secret] }}
      SUPABASE_ANON_KEY: ${{ secrets[matrix.anon_key_secret] }}
    steps:
      - name: Query select_options via PostgREST
        shell: bash
        run: |
          set -euo pipefail

          # ダッシュボードで貼り付けた際に混入しがちな改行・空白類を除去する
          # （URL に改行が残ると curl exit 3（Malformed URL）で落ち、anon key に残ると不正なヘッダになる）
          SUPABASE_URL="${SUPABASE_URL//[$'\r\n\t ']/}"
          SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY//[$'\r\n\t ']/}"

          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "::error::GitHub Secrets ${URL_SECRET_NAME} / ${ANON_KEY_SECRET_NAME} が未設定です（docs/setup.md 参照）"
            exit 1
          fi

          # スキーム欠落（http でアクセスして 301 になる）などの登録ミスを、Supabase 側の障害と切り分けて報告する。
          # ホスト名だけを取り出して URL を組み立て直すため、末尾スラッシュの個数や余分なパスにも影響されない
          if [[ ! "${SUPABASE_URL}" =~ ^https://([^/]+) ]]; then
            echo "::error::GitHub Secret ${URL_SECRET_NAME} の URL 形式が不正です（https://<project-ref>.supabase.co の形式で登録してください）"
            exit 1
          fi
          host="${BASH_REMATCH[1]}"

          # Secrets はログ上で自動マスクされるが、curl のエラーメッセージ
          # （例: Could not resolve host: <project-ref>.supabase.co）にはスキーム抜きのホスト名が出るため、
          # ホスト名単体もマスク対象に追加する（Actions ログは公開リポジトリでは誰でも閲覧できる）
          echo "::add-mask::${host}"

          endpoint="https://${host}/rest/v1/select_options?select=id&limit=1"

          # DNS 失敗（Pause 中は <ref>.supabase.co の DNS レコードが消える）など
          # レスポンスが得られない場合は curl 自体が非 0 で終了するので、終了コードを保持して fail にする。
          # --retry-all-errors: 一時的な名前解決失敗・接続失敗も再試行対象にする（最悪でも約 100 秒で timeout-minutes 内）
          rc=0
          status="$(curl --silent --show-error \
                --output /dev/null --write-out '%{http_code}' \
                --max-time 30 --retry 2 --retry-delay 5 --retry-all-errors \
                --header "apikey: ${SUPABASE_ANON_KEY}" \
                --header "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
                "${endpoint}")" || rc=$?

          if [ "${rc}" -ne 0 ]; then
            # curl の終了コードで原因を切り分ける（6: 名前解決失敗 = Pause の可能性大、28: タイムアウト）
            case "${rc}" in
              6)  hint="名前解決に失敗。プロジェクトが Pause していないか Supabase ダッシュボードで確認してください" ;;
              28) hint="タイムアウト" ;;
              *)  hint="接続失敗。直前の curl のエラーメッセージを確認してください" ;;
            esac
            echo "::error::[${TARGET}] Supabase への接続に失敗しました（curl exit ${rc}: ${hint}）"
            exit 1
          fi

          case "${status}" in
            2*)
              echo "[${TARGET}] OK: HTTP ${status}"
              ;;
            *)
              echo "::error::[${TARGET}] 想定外のレスポンス: HTTP ${status}（URL / anon key / RLS 設定を確認してください）"
              exit 1
              ;;
          esac
