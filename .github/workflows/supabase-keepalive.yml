name: Supabase Keep-Alive

# Prevents Supabase free-plan auto-pause (after 1 week idle the project pauses and its DNS disappears, so middleware returns 504) by sending a light PostgREST SELECT daily to both dev and prod projects. Secrets, manual run and stop procedure: docs/setup.md "Supabase keep-alive".
#
# - /auth/v1/health may not count as DB activity, so query select_options (anon-readable via RLS) through REST.
# - Vercel Cron runs only on production deployments (and the Hobby cron quota is used by the reminder), so use GitHub Actions. Prod is included as insurance in case Vercel Cron stops.
#
# Caveats:
# - schedule runs only from the workflow on the default branch (main).
# - The schedule runs as the user who last edited the cron line; failure notices reach only them and the schedule stops if they leave the repo, so another member should re-commit the cron line then.
# - GitHub disables schedules after 60 days of repo inactivity (public repo); check the Actions page periodically and re-enable.
on:
  schedule:
    # 06:17 JST (21:17 UTC): offset from Vercel Cron (00:00 UTC) and off the top of the hour, where schedules are delayed/skipped most.
    - cron: "17 21 * * *"
  workflow_dispatch:

# No checkout, so GITHUB_TOKEN gets no permissions.
permissions: {}

jobs:
  keepalive:
    name: keep-alive (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      # Send the request to the other project even if one fails.
      fail-fast: false
      matrix:
        include:
          - target: dev
            url_secret: KEEPALIVE_SUPABASE_URL_DEV
            anon_key_secret: KEEPALIVE_SUPABASE_ANON_KEY_DEV
          - target: prod
            url_secret: KEEPALIVE_SUPABASE_URL_PROD
            anon_key_secret: KEEPALIVE_SUPABASE_ANON_KEY_PROD
    env:
      TARGET: ${{ matrix.target }}
      URL_SECRET_NAME: ${{ matrix.url_secret }}
      ANON_KEY_SECRET_NAME: ${{ matrix.anon_key_secret }}
      SUPABASE_URL: ${{ secrets[matrix.url_secret] }}
      SUPABASE_ANON_KEY: ${{ secrets[matrix.anon_key_secret] }}
    steps:
      - name: Query select_options via PostgREST
        shell: bash
        run: |
          set -euo pipefail

          # Strip newlines/whitespace that creep in when pasting from the dashboard (a newline in the URL gives curl exit 3; in the anon key an invalid header).
          SUPABASE_URL="${SUPABASE_URL//[$'\r\n\t ']/}"
          SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY//[$'\r\n\t ']/}"

          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "::error::GitHub Secrets ${URL_SECRET_NAME} / ${ANON_KEY_SECRET_NAME} が未設定です（docs/setup.md 参照）"
            exit 1
          fi

          # Report registration mistakes (e.g. missing scheme giving a 301) separately from Supabase outages; rebuild the URL from the hostname only so trailing slashes and extra paths do not matter.
          if [[ ! "${SUPABASE_URL}" =~ ^https://([^/]+) ]]; then
            echo "::error::GitHub Secret ${URL_SECRET_NAME} の URL 形式が不正です（https://<project-ref>.supabase.co の形式で登録してください）"
            exit 1
          fi
          host="${BASH_REMATCH[1]}"

          # Secrets are auto-masked, but curl errors (e.g. Could not resolve host) print the bare hostname, so mask it too (Actions logs are public in a public repo).
          echo "::add-mask::${host}"

          endpoint="https://${host}/rest/v1/select_options?select=id&limit=1"

          # When no response is obtained (e.g. DNS failure while paused) curl exits non-zero; keep the exit code and fail. --retry-all-errors retries transient resolution/connection failures (worst case about 100 s, within timeout-minutes).
          rc=0
          status="$(curl --silent --show-error \
                --output /dev/null --write-out '%{http_code}' \
                --max-time 30 --retry 2 --retry-delay 5 --retry-all-errors \
                --header "apikey: ${SUPABASE_ANON_KEY}" \
                --header "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
                "${endpoint}")" || rc=$?

          if [ "${rc}" -ne 0 ]; then
            # Distinguish by curl exit code (6: resolution failure, likely paused; 28: timeout).
            case "${rc}" in
              6)  hint="名前解決に失敗。プロジェクトが Pause していないか Supabase ダッシュボードで確認してください" ;;
              28) hint="タイムアウト" ;;
              *)  hint="接続失敗。直前の curl のエラーメッセージを確認してください" ;;
            esac
            echo "::error::[${TARGET}] Supabase への接続に失敗しました（curl exit ${rc}: ${hint}）"
            exit 1
          fi

          case "${status}" in
            2*)
              echo "[${TARGET}] OK: HTTP ${status}"
              ;;
            *)
              echo "::error::[${TARGET}] 想定外のレスポンス: HTTP ${status}（URL / anon key / RLS 設定を確認してください）"
              exit 1
              ;;
          esac
