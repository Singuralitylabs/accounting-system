name: Release PR

# Creates the main -> release PR on manual dispatch with a version: runs the quality gates and detects pre-release work (migrations, new env vars, prod DB migration list) into the PR body. See docs/release.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "リリースバージョン番号（X.Y.Z 形式 / 例: 3.3.0）"
        required: true
        type: string
      summary:
        description: "リリースサマリー（任意 / PR 本文の冒頭に挿入され、Release ノートへ転記される）"
        required: false
        type: string

# Least-privilege GITHUB_TOKEN: pull-requests: write for PR creation, contents: read for checkout/diff.
permissions:
  contents: read
  pull-requests: write

# Prevent duplicate PRs from repeated triggers; do not cancel a running job, queue later ones.
concurrency:
  group: release-pr
  cancel-in-progress: false

jobs:
  # Input validation first, to avoid wasting later jobs.
  validate-input:
    name: 入力値の検証
    runs-on: ubuntu-latest
    steps:
      - name: バージョン形式チェック
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::バージョン番号は X.Y.Z 形式で指定してください（指定値: $VERSION）"
            exit 1
          fi

      # Reusable workflows (uses:) check out the dispatch branch, while PR creation and detection all target origin/main; running from another branch could create a PR even if main is broken, so require dispatch from main.
      - name: 起動ブランチチェック（main のみ許可）
        run: |
          set -euo pipefail
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::release-pr.yml は main ブランチから起動してください（起動元: ${{ github.ref }}）。"
            exit 1
          fi

      # Carrying an already-used version through to create-release would fail on a duplicate tag after the main -> release merge (production deploy), so check before creating the PR. Tags continue the existing REL-TAG-X.Y.Z naming.
      - name: タグ重複の事前チェック
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/REL-TAG-${VERSION}" --silent >/dev/null 2>&1; then
            echo "::error::タグ \`REL-TAG-${VERSION}\` は既に存在します。バージョン番号を変更してください。"
            exit 1
          fi
          echo "タグ \`REL-TAG-${VERSION}\` は未使用です。続行します。"

      # Do not create a second PR if a main -> release PR is open. Abort here, before spending the 4 quality gates (not repeated in create-pr). This job has no checkout, and gh resolves the repo from the cwd's git remote (ignoring GITHUB_REPOSITORY), so pass -R explicitly or it fails with "no git remotes found".
      - name: 既存リリース PR の存在確認
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NUMBER=$(gh pr list --base release --head main --state open \
            -R "$GITHUB_REPOSITORY" \
            --json number --jq '.[0].number // empty')
          if [ -n "$NUMBER" ]; then
            echo "::error::既存のリリース PR #${NUMBER} が open 状態です。先にこれをマージ／クローズしてください。"
            exit 1
          fi
          echo "オープン中のリリース PR はありません。続行します。"

  # Quality gates reuse the existing workflows (no duplicated check definitions); the typecheck.yml ESLint job covers no-console / no-debugger. PRs created with GITHUB_TOKEN do not trigger on: pull_request workflows, so the checks must run before PR creation.
  quality-typecheck:
    name: 品質ゲート Typecheck+Lint
    needs: validate-input
    uses: ./.github/workflows/typecheck.yml

  quality-test:
    name: 品質ゲート Test
    needs: validate-input
    uses: ./.github/workflows/test.yml

  quality-build:
    name: 品質ゲート Build
    needs: validate-input
    uses: ./.github/workflows/build.yml

  quality-format:
    name: 品質ゲート Format
    needs: validate-input
    uses: ./.github/workflows/format-check.yml

  # Detect pre-release work and create the release PR.
  create-pr:
    name: リリース PR 作成
    runs-on: ubuntu-latest
    needs:
      - validate-input
      - quality-typecheck
      - quality-test
      - quality-build
      - quality-format
    # The read-only prod DB connection string is an Environment-scoped Secret; a repo Secret would be readable by any workflow, so an Environment limits reach to this workflow (no protection rules).
    environment: production-db-readonly
    steps:
      # Full history is needed to walk both release and main.
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Update both release and main.
      - name: Fetch release and main branches
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          git fetch origin release:refs/remotes/origin/release

      # Split release..main migration changes into "added" and "modified/deleted applied files". Backward-compatibility detection covers added files only: scanning applied files changed only in comments would list already-run UPDATEs and drown out new migrations. Modified/deleted files are listed separately as a history-mismatch notice. --no-renames treats a rename as delete + add: a changed timestamp (first 14 digits) is a new version for the prod history and is re-run by db push, so it is scanned as added; a rename keeping the version is not re-applied, so it goes to the "modified" list.
      - name: マイグレーション差分を検出
        id: migrations
        run: |
          set -euo pipefail
          list_migrations() {
            git diff --no-renames --name-only --diff-filter="$1" \
              origin/release..origin/main -- 'supabase/migrations/' \
              | grep -E '\.sql$' || true
          }
          ADDED_ALL=$(list_migrations A)
          MODIFIED=$(list_migrations M)
          DELETED_ALL=$(list_migrations D)
          version_of() { basename "$1" | grep -oE '^[0-9]{14}' || true; }
          DELETED_VERSIONS=$(printf '%s\n' "$DELETED_ALL" | while IFS= read -r f; do
            [ -n "$f" ] && version_of "$f"
          done || true)
          ADDED=""
          RENAMED=""
          RENAMED_FROM=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            v=$(version_of "$f")
            if [ -n "$v" ] && printf '%s\n' "$DELETED_VERSIONS" | grep -qx "$v"; then
              RENAMED="$RENAMED$f"$'\n'
              RENAMED_FROM="$RENAMED_FROM$v"$'\n'
            else
              ADDED="$ADDED$f"$'\n'
            fi
          done <<< "$ADDED_ALL"
          ADDED=$(printf '%s' "$ADDED" | sed '/^$/d')
          RENAMED=$(printf '%s' "$RENAMED" | sed '/^$/d')
          # A same-version rename source is reported as one "rename" line, not a deletion.
          DELETED=$(printf '%s\n' "$DELETED_ALL" | while IFS= read -r f; do
            [ -z "$f" ] && continue
            if printf '%s' "$RENAMED_FROM" | grep -qx "$(version_of "$f")"; then continue; fi
            echo "$f"
          done || true)

          {
            echo "list<<MIGRATIONS_EOF"
            if [ -z "$ADDED" ]; then
              echo "- なし"
            else
              echo "$ADDED" | while IFS= read -r f; do
                [ -n "$f" ] && echo "- \`$f\`"
              done
            fi
            echo "MIGRATIONS_EOF"
            echo "files<<MIGRATIONS_FILES_EOF"
            printf '%s\n' "$ADDED"
            echo "MIGRATIONS_FILES_EOF"
            echo "changed<<MIGRATIONS_CHANGED_EOF"
            if [ -n "$MODIFIED" ]; then
              echo "$MODIFIED" | while IFS= read -r f; do
                [ -n "$f" ] && echo "- \`$f\`（変更）"
              done
            fi
            if [ -n "$RENAMED" ]; then
              echo "$RENAMED" | while IFS= read -r f; do
                [ -n "$f" ] && echo "- \`$f\`（リネーム。バージョン不変のため再適用されない）"
              done
            fi
            if [ -n "$DELETED" ]; then
              echo "$DELETED" | while IFS= read -r f; do
                [ -n "$f" ] && echo "- \`$f\`（削除）"
              done
            fi
            echo "MIGRATIONS_CHANGED_EOF"
            if [ -n "$MODIFIED$RENAMED$DELETED" ]; then
              echo "has_changed=true"
            else
              echo "has_changed=false"
            fi
          } >> "$GITHUB_OUTPUT"

      # Warn (not block) about migrations with backward-incompatible changes, scanning only files added in release..main (applied files that only changed are not re-run). To limit false positives, line (--) and block comments are stripped first, then:
      # - the DROP TRIGGER IF EXISTS prelude is excluded (normally paired with a CREATE in the same file)
      # - ALTER ... TYPE is limited to ALTER TABLE ... ALTER COLUMN ... TYPE
      # - UPDATE / DELETE count only as top-level statements, not inside function bodies ($$ ... $$) (avoids ON DELETE CASCADE, BEFORE UPDATE, trigger names, runtime logic)
      - name: 後方互換でないマイグレーションを検出
        id: breaking
        env:
          MIGRATION_FILES: ${{ steps.migrations.outputs.files }}
        run: |
          set -euo pipefail
          strip_comments() {
            sed -E 's/--.*$//' | sed -E ':a; s|/\*[^*]*\*/||g; ta'
          }
          # Strip dollar-quoted function bodies ($$ ... $$) so only top-level DML run at deploy time is judged. Save to a variable first, since grep consumes stdin.
          strip_function_bodies() {
            local input
            input=$(cat)
            if printf '%s' "$input" | grep -q '\$\$'; then
              printf '%s' "$input" | awk 'BEGIN { in_body = 0 } { n = gsub(/\$\$/, "&"); if (n % 2 == 1) { in_body = !in_body }; if (!in_body) print }'
            else
              printf '%s' "$input"
            fi
          }
          WARNINGS=""
          if [ -n "$(printf '%s' "$MIGRATION_FILES" | tr -d '[:space:]')" ]; then
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              CONTENT=$(git show "origin/main:$f" 2>/dev/null || true)
              [ -z "$CONTENT" ] && continue
              CODE=$(printf '%s' "$CONTENT" | strip_comments)
              TOP_LEVEL=$(printf '%s' "$CODE" | strip_function_bodies)
              ONE_LINE=$(printf '%s' "$CODE" | tr '\n' ' ')
              MATCHES=""
              if printf '%s' "$CODE" | grep -Eiq '(^|[^A-Za-z_])DROP[[:space:]]+(TABLE|COLUMN|INDEX|POLICY|FUNCTION|VIEW|CONSTRAINT)'; then
                MATCHES="$MATCHES DROP,"
              fi
              if printf '%s' "$CODE" | grep -Ei '(^|[^A-Za-z_])DROP[[:space:]]+TRIGGER[[:space:]]+[A-Za-z_]' | grep -Evi 'IF[[:space:]]+EXISTS' | grep -q .; then
                MATCHES="$MATCHES DROP,"
              fi
              if printf '%s' "$ONE_LINE" | grep -Eiq 'ALTER[[:space:]]+TABLE[[:space:]]+[^;]*ALTER[[:space:]]+COLUMN[^;]*TYPE'; then
                MATCHES="$MATCHES ALTER...TYPE,"
              fi
              if printf '%s' "$CODE" | grep -Eiq 'RENAME[[:space:]]+(COLUMN|TO)'; then
                MATCHES="$MATCHES RENAME,"
              fi
              if printf '%s' "$TOP_LEVEL" | grep -Eiqm1 '^[[:space:]]*(UPDATE|DELETE)[[:space:]]'; then
                MATCHES="$MATCHES UPDATE/DELETE,"
              fi
              if printf '%s' "$CODE" | grep -Eq 'storage\.buckets'; then
                MATCHES="$MATCHES storage.buckets,"
              fi
              if printf '%s' "$CODE" | grep -Eiq '(CREATE|ALTER|DROP)[[:space:]]+POLICY'; then
                MATCHES="$MATCHES POLICY,"
              fi
              if [ -n "$MATCHES" ]; then
                WARNINGS="$WARNINGS- \`$f\`（${MATCHES%,} を含む）"$'\n'
              fi
            done <<< "$MIGRATION_FILES"
          fi

          {
            echo "list<<BREAKING_EOF"
            if [ -z "$WARNINGS" ]; then
              echo "- なし"
            else
              printf '%s' "$WARNINGS"
            fi
            echo "BREAKING_EOF"
            if [ -n "$WARNINGS" ]; then
              echo "has_warnings=true"
            else
              echo "has_warnings=false"
            fi
          } >> "$GITHUB_OUTPUT"

      # Detect newly added process.env references in code only (app/** and middleware.ts); the repo has no .env.local.example (docs/setup.md). Counts both direct (process.env.X) and bracket (process.env[CONST], resolved to its value) forms.
      - name: 新規環境変数を検出
        id: env-vars
        run: |
          set -euo pipefail
          collect_keys() {
            local ref="$1"
            local dir
            dir=$(mktemp -d)
            git archive "$ref" app middleware.ts | tar -x -C "$dir"
            DIRECT=$(grep -rhoE 'process\.env\.[A-Za-z_][A-Za-z0-9_]*' "$dir/app" "$dir/middleware.ts" 2>/dev/null \
              | sed -E 's/.*process\.env\.//' | sort -u || true)
            BRACKET_CONSTS=$(grep -rhoE 'process\.env\[[A-Za-z_][A-Za-z0-9_]*\]' "$dir/app" "$dir/middleware.ts" 2>/dev/null \
              | sed -E 's/.*\[//; s/\]//' | sort -u || true)
            RESOLVED=""
            UNRESOLVED=""
            if [ -n "$BRACKET_CONSTS" ]; then
              while IFS= read -r c; do
                [ -z "$c" ] && continue
                VAL=$(grep -rhoE "${c}[[:space:]]*=[[:space:]]*[\"'][A-Za-z_][A-Za-z0-9_]*[\"']" "$dir/app" 2>/dev/null \
                  | head -n1 | sed -E "s/.*=[[:space:]]*[\"']//; s/[\"']//" || true)
                if [ -n "$VAL" ]; then
                  RESOLVED="$RESOLVED$VAL"$'\n'
                else
                  UNRESOLVED="$UNRESOLVED$c"$'\n'
                fi
              done <<< "$BRACKET_CONSTS"
            fi
            printf '%s\n%s' "$DIRECT" "$RESOLVED" \
              | grep -E '^[A-Za-z_][A-Za-z0-9_]*$' | sort -u || true
            rm -rf "$dir"
          }

          collect_keys origin/release > /tmp/keys.release || : > /tmp/keys.release
          collect_keys origin/main > /tmp/keys.main || : > /tmp/keys.main

          NEW_KEYS=$(comm -13 /tmp/keys.release /tmp/keys.main || true)
          CODE_KEYS=$(cat /tmp/keys.main || true)

          {
            echo "added<<ENV_ADDED_EOF"
            if [ -z "$(printf '%s' "$NEW_KEYS" | tr -d '[:space:]')" ]; then
              echo "- なし"
            else
              printf '%s\n' "$NEW_KEYS" | while IFS= read -r k; do
                [ -n "$k" ] && echo "- \`$k\`"
              done
            fi
            echo "ENV_ADDED_EOF"

            echo "code_refs<<ENV_CODE_EOF"
            if [ -z "$(printf '%s' "$CODE_KEYS" | tr -d '[:space:]')" ]; then
              echo "- なし"
            else
              printf '%s\n' "$CODE_KEYS" | while IFS= read -r k; do
                [ -n "$k" ] && echo "- \`$k\`"
              done
            fi
            echo "ENV_CODE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Run migration list read-only against the prod DB to show unapplied files and history mismatches; never db push. A connection failure does not block the release: the PR body gets a manual-check note (also when a free-plan prod DB is paused).
      - name: 本番DBの migration list を取得
        id: migration-list
        env:
          # Connection string (without password) and password are separate Secrets (Issue #195).
          SUPABASE_READONLY_DB_URL: ${{ secrets.SUPABASE_READONLY_DB_URL }}
          SUPABASE_READONLY_DB_PASSWORD: ${{ secrets.SUPABASE_READONLY_DB_PASSWORD }}
        run: |
          set -euo pipefail
          # Do not log connection info (no set -x / -v). The manual-check note assumes a supabase-linked project and uses npx: passing --db-url with a password via yarn makes yarn v1 print the whole command line.
          MANUAL_CHECK="手元で \`npx supabase migration list\`（\`supabase link\` 済みの本番プロジェクト）を実行して確認してください。"
          fallback() {
            {
              echo "body<<MIGRATION_LIST_EOF"
              echo "自動確認できませんでした（$1）。${MANUAL_CHECK}"
              echo "MIGRATION_LIST_EOF"
              echo "confirmed=false"
            } >> "$GITHUB_OUTPUT"
          }
          if [ -z "${SUPABASE_READONLY_DB_URL:-}" ] || [ -z "${SUPABASE_READONLY_DB_PASSWORD:-}" ]; then
            fallback "Secret 未設定"
            exit 0
          fi

          # Pass the password via PGPASSWORD, not argv: a wrapper such as yarn would print the command line into OUTPUT and thus the PR body (Issue #195). So do not run if the URL contains a password (old-format Secret). Check: an @ after ://, and the user part before the first @ is non-empty and has no ":" (splitting at the first @ tolerates unencoded / or ? in the password). A ?password=... query (any case) is also invalid.
          DB_URL_OK=false
          case "$SUPABASE_READONLY_DB_URL" in
            *://*@*)
              DB_URL_USER="${SUPABASE_READONLY_DB_URL#*://}"
              DB_URL_USER="${DB_URL_USER%%@*}"
              case "$DB_URL_USER" in
                '' | *:*) ;;
                *) DB_URL_OK=true ;;
              esac
              ;;
          esac
          if [[ "${SUPABASE_READONLY_DB_URL,,}" == *password=* ]]; then
            DB_URL_OK=false
          fi
          if [ "$DB_URL_OK" != "true" ]; then
            # Do not write a URL example (scheme://...@) in the note: it would match the PR-body check and turn the note into a PR creation failure.
            fallback "Secret SUPABASE_READONLY_DB_URL の形式が不正。URL にパスワードを含めず、パスワードは SUPABASE_READONLY_DB_PASSWORD に分けて登録する。docs/release.md の「読み取り専用ロール」参照"
            exit 0
          fi

          # Use the Session Pooler connection string (direct connections may be IPv6-only and unreachable).
          if OUTPUT=$(PGPASSWORD="$SUPABASE_READONLY_DB_PASSWORD" ./node_modules/.bin/supabase migration list --db-url "$SUPABASE_READONLY_DB_URL" 2>&1); then
            # Fail closed (no PR) if the output contains the password.
            if [[ "$OUTPUT" == *"$SUPABASE_READONLY_DB_PASSWORD"* ]]; then
              echo "::error::migration list の出力にパスワードが含まれているため中断します（Issue #195）。"
              exit 1
            fi
            {
              echo "body<<MIGRATION_LIST_EOF"
              echo '```'
              printf '%s\n' "$OUTPUT"
              echo '```'
              echo "MIGRATION_LIST_EOF"
              echo "confirmed=true"
            } >> "$GITHUB_OUTPUT"
          else
            fallback "DB Pause 等の可能性あり"
          fi

      # An open main -> release PR was already checked in validate-input (no double check after the quality gates).
      - name: リリース PR を作成
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          SUMMARY: ${{ inputs.summary }}
          MIGRATIONS_LIST: ${{ steps.migrations.outputs.list }}
          MIGRATIONS_CHANGED_LIST: ${{ steps.migrations.outputs.changed }}
          HAS_MIGRATIONS_CHANGED: ${{ steps.migrations.outputs.has_changed }}
          BREAKING_LIST: ${{ steps.breaking.outputs.list }}
          HAS_BREAKING: ${{ steps.breaking.outputs.has_warnings }}
          ENV_ADDED_LIST: ${{ steps.env-vars.outputs.added }}
          ENV_CODE_LIST: ${{ steps.env-vars.outputs.code_refs }}
          MIGRATION_LIST_BODY: ${{ steps.migration-list.outputs.body }}
          MIGRATION_CONFIRMED: ${{ steps.migration-list.outputs.confirmed }}
        run: |
          set -euo pipefail
          # NOTE: create-release.yml extracts only the summary between the HTML comment markers into the Release notes, so wrap only the summary body; the "### リリースサマリー" heading stays outside the markers for PR display.
          if [ -n "$(printf '%s' "${SUMMARY:-}" | tr -d '[:space:]')" ]; then
            SUMMARY_SECTION=$(printf '### リリースサマリー\n\n<!-- release-summary-start -->\n%s\n<!-- release-summary-end -->' "$SUMMARY")
          else
            SUMMARY_SECTION=""
          fi

          if [ "$HAS_BREAKING" = "true" ]; then
            BREAKING_SECTION=$(printf '### ⚠️ 後方互換でない変更の可能性\n\nリリースを2回に分ける判断が必要な場合があります。docs/database.md の該当節を確認してください。\n\n%s' "$BREAKING_LIST")
          else
            BREAKING_SECTION="### 後方互換でない変更の可能性"$'\n\n- なし'
          fi

          if [ "$HAS_MIGRATIONS_CHANGED" = "true" ]; then
            # shellcheck disable=SC2016 # backticks are Markdown code, not to be expanded
            MIGRATIONS_CHANGED_SECTION=$(printf '**適用済みマイグレーションの変更・削除（後方互換の検出対象外）:**\n\n`release` に含まれるファイルは本番に適用済みである前提で、内容を変更しても再適用されません。意図した変更か、`supabase migration list` の履歴と不整合が生じないかを確認してください（前回リリースで未適用のまま残ったファイルがある場合は、下の migration list で確認してください）。\n\n%s' "$MIGRATIONS_CHANGED_LIST")
          else
            MIGRATIONS_CHANGED_SECTION=""
          fi

          if [ "$MIGRATION_CONFIRMED" != "true" ]; then
            MIGRATION_NOTICE="> ⚠️ 本番DBへの自動接続ができなかったため、手元で \`npx supabase migration list\`（\`supabase link\` 済みの本番プロジェクト。\`yarn\` 経由で \`--db-url\` を渡さない）を実行して未適用分を確認してください。"
          else
            MIGRATION_NOTICE=""
          fi

          # The body template is a quoted <<'EOF' fixed string so backticks and $(...) are not executed (Issue #168). Values are expanded explicitly by listing variable names to envsubst (other $ forms stay literal). envsubst substitutes in one pass, so ${...} inside inserted values (e.g. the summary) is not re-expanded. It reads only environment variables, so export values built in this step.
          if ! command -v envsubst >/dev/null 2>&1; then
            echo "::error::envsubst（gettext-base）が見つかりません。PR 本文を組み立てられないため中断します。"
            exit 1
          fi
          export SUMMARY_SECTION BREAKING_SECTION MIGRATIONS_CHANGED_SECTION MIGRATION_NOTICE
          # shellcheck disable=SC2016 # list of variable names for envsubst, not expanded by the shell
          BODY_VARS='${VERSION} ${SUMMARY_SECTION} ${BREAKING_SECTION} ${MIGRATIONS_LIST} ${MIGRATIONS_CHANGED_SECTION} ${BREAKING_LIST} ${ENV_ADDED_LIST} ${ENV_CODE_LIST} ${MIGRATION_NOTICE} ${MIGRATION_LIST_BODY}'
          TEMPLATE=$(cat <<'EOF'
          ## リリース ${VERSION}

          このPRは `main` ブランチを `release` ブランチへマージするためのリリース PR です。
          マージ後に `create-release.yml` が起動し、承認後に Git タグと GitHub Release が作成されます。

          ${SUMMARY_SECTION}

          ${BREAKING_SECTION}

          ### 事前作業の検出結果

          **マイグレーションファイル（release..main で追加）:**
          ${MIGRATIONS_LIST}

          ${MIGRATIONS_CHANGED_SECTION}

          **後方互換でない変更の可能性があるファイル（追加分が対象）:**
          ${BREAKING_LIST}

          **新規環境変数（コード側の process.env 参照で追加。対象は `app/` 配下と `middleware.ts`）:**
          ${ENV_ADDED_LIST}

          **コード側の環境変数参照（現行の一覧）:**
          ${ENV_CODE_LIST}

          **本番DBの migration list（読み取り専用・db push は実行しない）:**
          ${MIGRATION_NOTICE}
          ${MIGRATION_LIST_BODY}

          ### マージ前チェックリスト

          - [ ] 上記マイグレーションを本番 Supabase に適用済み（`supabase migration list` で履歴一致を確認。`db push` は手動実行）
          - [ ] 上記環境変数を本番環境（Vercel）に登録済み
          - [ ] 本番 Supabase の Exposed schemas に `private` が含まれていないこと（docs/database.md 5.12）
          - [ ] Custom Access Token Hook の有効化はマイグレーション適用後に行うこと（該当リリースのみ。docs/database.md）
          - [ ] 本番 DB のバックアップを取得した（無料プランのため取得できない場合は、追加系マイグレーションに限り省略可と判断した理由を記載）
          - [ ] 後方互換でない変更が無いか確認済み（ある場合はリリース分割の判断済み）
          - [ ] 差分内容を確認済み
          - [ ] 本番動作確認後に create-release の承認を行うことを把握している（手順は docs/release.md）
          EOF
          )

          # Fail if ${...} in the template and the BODY_VARS list disagree (an unlisted variable would appear unexpanded in the PR body; a leftover name is needless config). Only ${NAME} form is checked: write inserted variables as ${NAME}, and do not use ${...} for a literal $ in the template.
          TEMPLATE_VARS=$(printf '%s\n' "$TEMPLATE" | grep -oE '\$\{[A-Za-z_][A-Za-z0-9_]*\}' | sort -u || true)
          LISTED_VARS=$(printf '%s\n' "$BODY_VARS" | tr ' ' '\n' | sed '/^$/d' | sort -u)
          if [ "$TEMPLATE_VARS" != "$LISTED_VARS" ]; then
            echo "::error::PR 本文テンプレートの差し込み変数と BODY_VARS の列挙が一致しません。"
            echo "テンプレートにあって BODY_VARS に無い変数:"
            comm -23 <(printf '%s\n' "$TEMPLATE_VARS") <(printf '%s\n' "$LISTED_VARS")
            echo "BODY_VARS にあってテンプレートに無い変数:"
            comm -13 <(printf '%s\n' "$TEMPLATE_VARS") <(printf '%s\n' "$LISTED_VARS")
            exit 1
          fi
          BODY=$(printf '%s\n' "$TEMPLATE" | envsubst "$BODY_VARS")

          # Fail without creating the PR if the body contains a URL with credentials (userinfo); PR bodies in a public repo persist in edit history (fail closed; Issue #195).
          # - scheme://<userinfo>@ : also empty user (://:pw@) or token-only (https://ghp_xxx@)
          # - postgres(ql)://...@ : tolerates unencoded / etc. in the password
          # Do not log the match. Do not pipe: under pipefail, grep -q exiting early makes printf get SIGPIPE and a match evaluates false.
          if grep -qiE '[a-z][a-z0-9+.-]*://[^[:space:]/?#@]+@|postgres(ql)?://[^[:space:]]*@' <<<"$BODY"; then
            echo "::error::PR 本文に認証情報付きの URL が含まれているため、PR を作成せずに中断します（Issue #195）。"
            exit 1
          fi

          # Create as Draft (prevents merging before migrations are applied).
          gh pr create \
            --base release \
            --head main \
            --draft \
            --title "リリース ${VERSION}" \
            --body "$BODY"
