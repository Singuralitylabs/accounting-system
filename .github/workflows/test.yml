name: Unit Tests

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "middleware.ts"
      - "tests/**"
      - "vitest.config.ts"
      - "package.json"
      - "yarn.lock"
  pull_request:
    paths:
      - "app/**"
      - "middleware.ts"
      - "tests/**"
      - "vitest.config.ts"
      - "package.json"
      - "yarn.lock"
  workflow_dispatch:
  # Reused by the release-PR quality gate (release-pr.yml).
  workflow_call:

jobs:
  test:
    name: Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Run unit tests
        run: yarn test
