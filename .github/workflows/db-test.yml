name: DB Tests

# pgTAP による DB 関数のテスト（supabase/tests/database/。docs/testing.md 3.8）
on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/db-test.yml"
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/db-test.yml"
  workflow_dispatch:

jobs:
  pgtap:
    name: pgTAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # 最新の CLI に追従する（db start / test db は安定したサブコマンド。壊れたら固定する）
          version: latest
      # マイグレーションが auth.users を参照し、テストも auth.users に行を作るため、
      # DB だけでなく Auth を含むローカルスタックを起動する（supabase/migrations を適用）
      - name: Start local Supabase
        run: supabase start
      - name: Run pgTAP tests
        run: supabase test db
