name: DB Tests

# pgTAP による DB 関数のテスト（supabase/tests/database/。docs/testing.md 3.8）
on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/db-test.yml"
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/db-test.yml"
  workflow_dispatch:

jobs:
  pgtap:
    name: pgTAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local database (applies supabase/migrations)
        run: supabase db start
      - name: Run pgTAP tests
        run: supabase test db
