name: DB Tests

# pgTAP tests for DB functions (supabase/tests/database/).
on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/db-test.yml"
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/db-test.yml"
  workflow_dispatch:

jobs:
  pgtap:
    name: pgTAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Migrations and tests use auth.users, so start the local stack including Auth (applies supabase/migrations).
      - name: Start local Supabase
        run: supabase start
      - name: Run pgTAP tests
        run: supabase test db
