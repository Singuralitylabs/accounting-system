name: Create Release

# release ブランチへの PR マージ後、承認ゲートを経て Git タグと GitHub Release を作成する。
# 本番動作確認を終えた人間が承認するまでタグが打たれない状態を、
# GitHub Environments の Required reviewers で担保する。手順の詳細は docs/release.md を参照。
# 参考実装: Sinlab Study の create-release.yml（タグ命名 vX.Y.Z → REL-TAG-X.Y.Z に読み替え）。
on:
  pull_request:
    branches:
      - release
    types:
      - closed
  workflow_dispatch:
    inputs:
      version:
        description: "リリースバージョン番号（X.Y.Z 形式 / 例: 3.3.0）"
        required: true
        type: string

# タグ push と GitHub Release 作成に contents: write、
# リリース PR 本文からのサマリー抽出に pull-requests: read を使う。
# 承認ゲートの保護ルール確認（GET /repos/{repo}/environments/{name}）に actions: read を使う。
# いずれも必要最小限であり、書き込みはタグ・Release 作成に限定する（db push 等は含まない）。
permissions:
  contents: write
  pull-requests: read
  actions: read

# 同一ワークフローの同時実行を抑止する。実行中のものはキャンセルせず後続をキュー待ちさせる。
concurrency:
  group: create-release
  cancel-in-progress: false

jobs:
  # 各種ガード条件のチェック。すべて通過した場合のみ承認ゲート → release ジョブへ進む。
  validate:
    name: ガード条件チェック
    runs-on: ubuntu-latest
    # マージ済みチェック: pull_request トリガーではマージされた場合のみ実行する。
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true }}
    outputs:
      version: ${{ steps.extract.outputs.version }}
      target_sha: ${{ steps.target.outputs.sha }}
      summary: ${{ steps.summary.outputs.body }}
      skip: ${{ steps.extract.outputs.skip }}
    steps:
      # PR タイトル or 手動入力からバージョン文字列を抽出する。
      - name: バージョン抽出（PR タイトル or 手動入力）
        id: extract
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$MANUAL_VERSION"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            # PR タイトルチェック: 「リリース」で始まらない PR は対象外として
            # 正常終了（スキップ）する。失敗扱いにすると赤い実行が残り続けるため。
            if ! printf '%s' "$PR_TITLE" | grep -Eq '^リリース[[:space:]　]'; then
              echo "::warning::PR タイトルが「リリース」で始まらないためスキップします: $PR_TITLE"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "version=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "skip=false" >> "$GITHUB_OUTPUT"
            # 例: 「リリース 3.3.0」「リリース v3.3.0」→ 3.3.0
            VERSION=$(printf '%s' "$PR_TITLE" | sed -E 's/^リリース[[:space:]　]+v?//' | tr -d '[:space:]　')
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "抽出されたバージョン: $VERSION"

      # バージョン形式チェック: X.Y.Z の形式でなければエラー終了する。
      - name: バージョン形式チェック
        if: ${{ steps.extract.outputs.skip != 'true' }}
        env:
          VERSION: ${{ steps.extract.outputs.version }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::バージョン番号は X.Y.Z 形式である必要があります（抽出値: $VERSION）"
            exit 1
          fi

      # head ブランチの検証（pull_request 経路のみ）。作業ブランチ → release の
      # 直接 PR に「リリース X.Y.Z」と付けてマージすると、main のどの時点とも
      # 一致しないツリーにタグが打たれる。運用ルール（CLAUDE.md の「release へは
      # main 経由のみ」）を自動化側で強制する。fork からの PR も同様に拒否する。
      - name: head ブランチの検証（main のみ許可）
        if: ${{ steps.extract.outputs.skip != 'true' && github.event_name == 'pull_request' }}
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          if [ "$HEAD_REF" != "main" ] || [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::リリース対象の head は同一リポジトリの main である必要があります（検出値: $HEAD_REPO:$HEAD_REF）。"
            exit 1
          fi
          echo "head ブランチを確認しました（$HEAD_REPO:$HEAD_REF）。"

      # 承認ゲートの保護ルールを確認する。存在しない Environment を参照すると GitHub が
      # 保護ルールなしで自動作成し、承認なしでタグ・Release が作られる（フェイルオープン）。
      # Required reviewers が設定されていない場合はここで失敗させ、承認なしのリリースを防ぐ。
      # API エラーは握りつぶさず、HTTP ステータスで原因（Environment 未作成 / 権限不足 /
      # Required reviewers 未設定 / その他）を切り分けてログに出す。どの場合も失敗させる（フェイルクローズ）。
      - name: 承認ゲートの保護ルールを確認
        if: ${{ steps.extract.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENV_NAME: production-release
        run: |
          set -euo pipefail
          RESP_FILE=$(mktemp)
          ERR_FILE=$(mktemp)
          # --include でステータス行（例: HTTP/2.0 404 Not Found）とヘッダを本文の前に出力させる。
          # gh api は 4xx / 5xx で非ゼロ終了するが、その場合も応答はファイルに残るため判定を続ける。
          if gh api --include "repos/${GITHUB_REPOSITORY}/environments/${ENV_NAME}" >"$RESP_FILE" 2>"$ERR_FILE"; then
            GH_EXIT=0
          else
            GH_EXIT=$?
          fi
          HTTP_STATUS=$(head -n1 "$RESP_FILE" | tr -d '\r' | sed -nE 's#^HTTP/[0-9.]+ ([0-9]{3}).*#\1#p')
          if [ -z "$HTTP_STATUS" ]; then
            # ステータス行が取れない場合は gh のエラーメッセージ（例: gh: Not Found (HTTP 404)）から拾う
            HTTP_STATUS=$(sed -nE 's#.*\(HTTP ([0-9]{3})\).*#\1#p' "$ERR_FILE" | head -n1)
          fi
          # ヘッダと本文を区切る空行より後ろを本文として取り出す
          RESP_BODY=$(tr -d '\r' < "$RESP_FILE" | awk 'in_body { print; next } /^$/ { in_body = 1 }')
          API_MESSAGE=$(printf '%s' "$RESP_BODY" | jq -r '.message? // empty' 2>/dev/null || true)
          echo "承認ゲート確認: GET environments/${ENV_NAME} → HTTP ${HTTP_STATUS:-不明}（gh 終了コード: ${GH_EXIT}）"
          if [ -n "$API_MESSAGE" ]; then
            echo "API メッセージ: ${API_MESSAGE}"
          fi
          if [ -s "$ERR_FILE" ]; then
            echo "gh の標準エラー出力:"
            cat "$ERR_FILE"
          fi

          case "${HTTP_STATUS:-}" in
            200)
              if ! RULES=$(printf '%s' "$RESP_BODY" | jq -r '.protection_rules[]?.type'); then
                echo "::error::Environment '${ENV_NAME}' の応答（HTTP 200）を解析できませんでした。承認ゲートを確認できないため中断します。"
                exit 1
              fi
              if ! printf '%s\n' "$RULES" | grep -qx 'required_reviewers'; then
                CONFIGURED=$(printf '%s\n' "$RULES" | sed '/^$/d' | paste -sd, - || true)
                echo "::error::Environment '${ENV_NAME}' に Required reviewers が設定されていません（HTTP 200。設定済みの保護ルール: ${CONFIGURED:-なし}）。Settings → Environments で承認者を登録してから再実行してください。"
                exit 1
              fi
              ;;
            404)
              echo "::error::Environment '${ENV_NAME}' が存在しません（HTTP 404）。Settings → Environments で作成し、Required reviewers を設定してから再実行してください。"
              exit 1
              ;;
            403)
              echo "::error::Environment '${ENV_NAME}' の取得が拒否されました（HTTP 403: ${API_MESSAGE:-詳細なし}）。ワークフローの permissions に actions: read があるか、API レート制限に掛かっていないかを確認してください。"
              exit 1
              ;;
            "")
              echo "::error::Environment '${ENV_NAME}' の取得に失敗しました（HTTP 応答なし。gh 終了コード: ${GH_EXIT}）。ネットワーク障害などの可能性があります。時間をおいて再実行してください。"
              exit 1
              ;;
            *)
              echo "::error::Environment '${ENV_NAME}' の取得で想定外の応答がありました（HTTP ${HTTP_STATUS}: ${API_MESSAGE:-詳細なし}）。承認ゲートを確認できないため中断します。"
              exit 1
              ;;
          esac
          echo "承認ゲート（Required reviewers）を確認しました。"

      # タグ重複チェックのため release ブランチをチェックアウトする（タグ情報も取得）。
      - name: Checkout release branch with tags
        if: ${{ steps.extract.outputs.skip != 'true' }}
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      # リリース対象コミットの SHA を確定する。
      # 承認ゲートでの待機中に release ブランチが進んでも、ここで固定した SHA に対してタグを付与することで、
      # 「意図しないコミットにタグが付く」事故を防ぐ。
      # 手動起動はリリース PR マージ後の再実行専用とし、release HEAD が「リリース X.Y.Z」の
      # マージ済みリリース PR（同一リポジトリの main が head）のマージコミットであることを検証する。
      # マージ前に起動すると HEAD は前回リリースのマージコミット（親 2 つ）であり squash 検出も
      # 通過するため、ここで止めないと旧ツリーに新バージョンのタグが付く。
      # 特定した PR 番号は後続のリリースサマリー抽出でも使う。
      - name: 対象コミット SHA を確定
        id: target
        if: ${{ steps.extract.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          VERSION: ${{ steps.extract.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # 手動起動時は現時点の release HEAD を対象とし、リリース PR のマージコミットか検証する。
            SHA=$(git rev-parse HEAD)
            # API エラーは握りつぶさず失敗させる（検証できない場合はタグを付けない）。
            if ! MERGED_PRS=$(gh pr list -R "$GITHUB_REPOSITORY" --base release --state merged --limit 50 \
              --json number,title,headRefName,isCrossRepository,mergeCommit); then
              echo "::error::マージ済みのリリース PR 一覧を取得できませんでした（上記の gh のエラーを参照）。検証できないためタグを付けずに中断します。"
              exit 1
            fi
            PR_JSON=$(printf '%s' "$MERGED_PRS" \
              | jq -c --arg sha "$SHA" '[.[] | select(.mergeCommit.oid == $sha)] | first // empty')
            if [ -z "$PR_JSON" ]; then
              echo "::error::release HEAD（${SHA}）はマージ済みのリリース PR のマージコミットではありません。手動実行はリリース PR「リリース ${VERSION}」をマージした後の再実行専用です（リリース PR のマージ前に実行していないか確認してください）。"
              exit 1
            fi
            PR_NUMBER=$(printf '%s' "$PR_JSON" | jq -r '.number')
            PR_TITLE=$(printf '%s' "$PR_JSON" | jq -r '.title')
            PR_HEAD_REF=$(printf '%s' "$PR_JSON" | jq -r '.headRefName')
            PR_CROSS_REPO=$(printf '%s' "$PR_JSON" | jq -r '.isCrossRepository')
            # バージョンの取り出しは pull_request 経路（バージョン抽出ステップ）と同じ規則にする。
            PR_VERSION=""
            if printf '%s' "$PR_TITLE" | grep -Eq '^リリース[[:space:]　]'; then
              PR_VERSION=$(printf '%s' "$PR_TITLE" | sed -E 's/^リリース[[:space:]　]+v?//' | tr -d '[:space:]　')
            fi
            if [ "$PR_VERSION" != "$VERSION" ]; then
              echo "::error::release HEAD（${SHA}）は PR #${PR_NUMBER}「${PR_TITLE}」のマージコミットであり、指定バージョン ${VERSION} のリリース PR ではありません。リリース PR「リリース ${VERSION}」のマージ後に実行してください。"
              exit 1
            fi
            if [ "$PR_HEAD_REF" != "main" ] || [ "$PR_CROSS_REPO" != "false" ]; then
              echo "::error::PR #${PR_NUMBER} の head が同一リポジトリの main ではありません（検出値: ${PR_HEAD_REF}、別リポジトリ: ${PR_CROSS_REPO}）。"
              exit 1
            fi
            echo "release HEAD は PR #${PR_NUMBER}「${PR_TITLE}」のマージコミットです。"
            echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          else
            # PR マージ時は確定済みのマージコミット SHA を使用する（承認待ち中の release 進行に影響されない）。
            SHA="$MERGE_SHA"
          fi
          if [ -z "$SHA" ]; then
            echo "::error::対象コミット SHA を決定できませんでした"
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "対象コミット: $SHA"

      # squash マージの検出。release への Squash / Rebase を禁止している。
      # マージコミットの親が2つあることを検証し、squash されていた場合はタグを打たずに失敗させる。
      - name: マージコミットの親数チェック（squash 検出）
        if: ${{ steps.extract.outputs.skip != 'true' }}
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          PARENT_COUNT=$(git rev-list --parents -n 1 "$TARGET_SHA" | wc -w)
          # 出力は "<sha> <parent1> <parent2>..." のため、親数 = 単語数 - 1。
          PARENT_COUNT=$((PARENT_COUNT - 1))
          echo "親コミット数: $PARENT_COUNT"
          if [ "$PARENT_COUNT" -ne 2 ]; then
            echo "::error::対象コミット $TARGET_SHA の親が ${PARENT_COUNT} 個です。release へのマージは merge commit（親2つ）で行ってください（Squash / Rebase 禁止）。"
            exit 1
          fi

      # リリース PR 本文から「リリースサマリー」セクションを抽出する。
      # release-pr.yml がマーカーで囲んで PR 本文に挿入しているため、その間の本文を切り出して Release ノートに反映する。
      # 抽出失敗（マーカー欠落・PR 特定不可）は致命エラーではなく、自動生成ノートのみで Release を作成する。
      - name: リリースサマリーを PR 本文から抽出
        id: summary
        if: ${{ steps.extract.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 手動起動時は「対象コミット SHA を確定」で検証済みのリリース PR 番号を使う。
          PR_NUMBER: ${{ github.event.pull_request.number || steps.target.outputs.pr_number }}
        run: |
          set -euo pipefail
          if [ -z "${PR_NUMBER:-}" ]; then
            echo "::warning::対象 PR を特定できませんでした。自動生成ノートのみで Release を作成します。"
            {
              echo "body<<RELEASE_SUMMARY_EOF"
              echo "RELEASE_SUMMARY_EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PR_BODY=$(gh pr view "$PR_NUMBER" --json body --jq .body)

          EXTRACTED=$(printf '%s\n' "$PR_BODY" | awk '
            /<!-- release-summary-start -->/ { capture=1; next }
            /<!-- release-summary-end -->/ { capture=0 }
            capture { print }
          ')

          if [ -z "$(printf '%s' "$EXTRACTED" | tr -d '[:space:]')" ]; then
            echo "::warning::PR #${PR_NUMBER} の本文にリリースサマリーマーカーが見つかりませんでした。"
          else
            echo "PR #${PR_NUMBER} からリリースサマリーを抽出しました。"
          fi

          {
            echo "body<<RELEASE_SUMMARY_EOF"
            printf '%s\n' "$EXTRACTED"
            echo "RELEASE_SUMMARY_EOF"
          } >> "$GITHUB_OUTPUT"

      # タグ重複チェック: 同名タグが既に存在する場合はエラー終了する。
      # ただし部分失敗後の再実行で、同名タグが今回の対象コミット自体を指している場合は
      # 正常系として続行する（release ジョブ側も冪等化してあるため再実行で完遂できる）。
      - name: タグ重複チェック
        if: ${{ steps.extract.outputs.skip != 'true' }}
        env:
          VERSION: ${{ steps.extract.outputs.version }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/REL-TAG-${VERSION}" >/dev/null; then
            EXISTING_SHA=$(git rev-list -n 1 "REL-TAG-${VERSION}^{commit}")
            if [ "$EXISTING_SHA" = "$TARGET_SHA" ]; then
              echo "::warning::タグ \`REL-TAG-${VERSION}\` は既に対象コミットを指しています。再実行として続行します。"
            else
              echo "::error::タグ \`REL-TAG-${VERSION}\` は既に別のコミットを指しています。バージョン番号を変更してください。"
              exit 1
            fi
          else
            echo "タグ \`REL-TAG-${VERSION}\` は未使用です。続行します。"
          fi

  # 承認ゲート付きのリリースジョブ。Environment の Required reviewers で承認待ちになる。
  release:
    name: タグ作成と GitHub Release 公開
    runs-on: ubuntu-latest
    needs: validate
    # リリース対象外の PR では validate がスキップ出力になるため、release も実行しない。
    # needs がスキップされた場合のフォールバックとして、マージ済み条件自体もここで再確認する。
    if: ${{ (github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true) && needs.validate.outputs.skip != 'true' }}
    # GitHub Environments 側で Required reviewers を設定することで承認ゲートとして機能する。
    # Deployment branches and tags の branch 制限は設定しない（pull_request イベントや
    # workflow_dispatch が制限ではじかれて承認段階に到達できなくなるため）。
    environment:
      name: production-release
    steps:
      # validate ジョブで確定した SHA をチェックアウトする（release ブランチ HEAD ではなく固定 SHA）。
      - name: Checkout target commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.target_sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Git ユーザー情報設定
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Git タグ作成と push
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          TARGET_SHA: ${{ needs.validate.outputs.target_sha }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/REL-TAG-${VERSION}" >/dev/null; then
            # validate から承認までの間に別コミットへ手動 push されたタグを
            # 黙って採用しないよう、再利用前に指し先を再検証する。
            EXISTING_SHA=$(git rev-list -n 1 "REL-TAG-${VERSION}^{commit}")
            if [ "$EXISTING_SHA" != "$TARGET_SHA" ]; then
              echo "::error::タグ \`REL-TAG-${VERSION}\` は既に別のコミット（${EXISTING_SHA}）を指しています。対象コミットは ${TARGET_SHA} です。バージョン番号を変更するか、タグの指し先を確認してください。"
              exit 1
            fi
            echo "タグ \`REL-TAG-${VERSION}\` は既に対象コミットを指しているため再利用します。"
          else
            # 注釈付きタグを確定済み SHA に対して作成する（承認待ち中の release 進行に影響されない）。
            git tag -a "REL-TAG-${VERSION}" -m "リリース ${VERSION}" "${TARGET_SHA}"
            git push origin "REL-TAG-${VERSION}"
          fi

      - name: GitHub Release を公開
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
          TARGET_SHA: ${{ needs.validate.outputs.target_sha }}
          SUMMARY: ${{ needs.validate.outputs.summary }}
        run: |
          set -euo pipefail
          # 部分失敗後の再実行では Release が既に存在するため、その場合は作成をスキップする。
          if gh release view "REL-TAG-${VERSION}" >/dev/null 2>&1; then
            echo "Release \`REL-TAG-${VERSION}\` は既に存在するため作成をスキップします。"
            exit 0
          fi
          # 自動生成ノートの起点は直前の既存 REL-TAG-* タグにする。本リポジトリには
          # タグのみで Release が無い世代があるため、previous_tag_name を省略すると
          # 初回実行で全履歴分のノートが生成される。マージコミットの第1親（main 側）
          # から到達可能な最新タグを取り、無ければ省略する（= 全履歴。初回のみ）。
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'REL-TAG-*' "${TARGET_SHA}^1" 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            echo "自動生成ノートの起点: $PREV_TAG"
            AUTO_NOTES=$(gh api \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="REL-TAG-${VERSION}" \
              -f target_commitish="${TARGET_SHA}" \
              -f previous_tag_name="$PREV_TAG" \
              --jq .body)
          else
            echo "::warning::起点となる既存タグが無いため、全履歴分のノートを生成します。"
            AUTO_NOTES=$(gh api \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="REL-TAG-${VERSION}" \
              -f target_commitish="${TARGET_SHA}" \
              --jq .body)
          fi

          NOTES_FILE=$(mktemp)
          if [ -n "$(printf '%s' "$SUMMARY" | tr -d '[:space:]')" ]; then
            {
              printf '%s\n\n' "$SUMMARY"
              echo "---"
              echo ""
              printf '%s\n' "$AUTO_NOTES"
            } > "$NOTES_FILE"
          else
            printf '%s\n' "$AUTO_NOTES" > "$NOTES_FILE"
          fi

          # --target に SHA を指定し、リリース対象を確定済みコミットに固定する。
          gh release create "REL-TAG-${VERSION}" \
            --target "${TARGET_SHA}" \
            --title "REL-TAG-${VERSION}" \
            --notes-file "$NOTES_FILE"

      - name: 成功サマリーを出力
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          TARGET_SHA: ${{ needs.validate.outputs.target_sha }}
        run: |
          set -euo pipefail
          {
            echo "## ✅ リリース ${VERSION} を公開しました"
            echo ""
            echo "- タグ: \`REL-TAG-${VERSION}\`"
            echo "- 対象コミット: \`${TARGET_SHA}\`"
            echo "- Release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/REL-TAG-${VERSION}"
            echo ""
            echo "タグ・Release の作成は冪等化してあるため、部分失敗時はワークフローを再実行してください。"
          } >> "$GITHUB_STEP_SUMMARY"
