name: Create Release

# Creates the Git tag and GitHub Release after a PR to release is merged and an approval gate passes. Required reviewers on the GitHub Environment ensure no tag is created until a human has verified production. See docs/release.md.
on:
  pull_request:
    branches:
      - release
    types:
      - closed
  workflow_dispatch:
    inputs:
      version:
        description: "リリースバージョン番号（X.Y.Z 形式 / 例: 3.3.0）"
        required: true
        type: string

# contents: write for tag push and Release creation; pull-requests: read for extracting the summary from the release PR body and verifying the target commit on manual runs; actions: read for checking the approval gate's protection rules. Writes are limited to tag/Release creation (no db push).
permissions:
  contents: write
  pull-requests: read
  actions: read

# Do not cancel a running instance; queue later runs.
concurrency:
  group: create-release
  cancel-in-progress: false

jobs:
  # Guard checks; only if all pass does it proceed to the approval gate and release job.
  validate:
    name: ガード条件チェック
    runs-on: ubuntu-latest
    # Merged check: on pull_request only run when merged.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true }}
    outputs:
      version: ${{ steps.extract.outputs.version }}
      target_sha: ${{ steps.target.outputs.sha }}
      summary: ${{ steps.summary.outputs.body }}
      skip: ${{ steps.extract.outputs.skip }}
    steps:
      # Extract the version from the PR title or manual input.
      - name: バージョン抽出（PR タイトル or 手動入力）
        id: extract
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$MANUAL_VERSION"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            # PRs whose title does not start with "リリース" exit successfully (skipped); failing would leave red runs.
            if ! printf '%s' "$PR_TITLE" | grep -Eq '^リリース[[:space:]　]'; then
              echo "::warning::PR タイトルが「リリース」で始まらないためスキップします: $PR_TITLE"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "version=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "skip=false" >> "$GITHUB_OUTPUT"
            # Take only X.Y.Z, since the title may carry a description: "リリース 3.3.0" / "リリース v3.3.0" / "リリース 3.3.0: <更新内容>" -> 3.3.0. An unmatched title leaves VERSION empty and fails the format check.
            VERSION=$(printf '%s' "$PR_TITLE" | sed -nE 's/^リリース[[:space:]　]+v?([0-9]+\.[0-9]+\.[0-9]+)([[:space:]　:：].*)?$/\1/p' | head -n1)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "抽出されたバージョン: $VERSION"

      # Version format check: fail unless X.Y.Z.
      - name: バージョン形式チェック
        if: ${{ steps.extract.outputs.skip != 'true' }}
        env:
          VERSION: ${{ steps.extract.outputs.version }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::バージョン番号は X.Y.Z 形式である必要があります（抽出値: $VERSION）"
            exit 1
          fi

      # Verify the head branch (pull_request path only): merging a work-branch -> release PR titled "リリース X.Y.Z" would tag a tree matching no point of main. Enforce the "release only via main" rule (CLAUDE.md) here; PRs from forks are rejected too.
      - name: head ブランチの検証（main のみ許可）
        if: ${{ steps.extract.outputs.skip != 'true' && github.event_name == 'pull_request' }}
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          if [ "$HEAD_REF" != "main" ] || [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::リリース対象の head は同一リポジトリの main である必要があります（検出値: $HEAD_REPO:$HEAD_REF）。"
            exit 1
          fi
          echo "head ブランチを確認しました（$HEAD_REPO:$HEAD_REF）。"

      # Check the approval gate's protection rules. GitHub auto-creates a missing Environment without protection, which would release without approval (fail-open). Fail here if Required reviewers are not set. API errors are not swallowed: log the cause by HTTP status (missing Environment / no permission / no Required reviewers / other) and always fail (fail-closed).
      - name: 承認ゲートの保護ルールを確認
        if: ${{ steps.extract.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENV_NAME: production-release
        run: |
          set -euo pipefail
          RESP_FILE=$(mktemp)
          ERR_FILE=$(mktemp)
          # --include prints the status line and headers before the body. gh api exits non-zero on 4xx/5xx but the response stays in the file, so keep judging. Pin the API version so the format does not change with gh defaults.
          if gh api --include -H 'X-GitHub-Api-Version: 2022-11-28' "repos/${GITHUB_REPOSITORY}/environments/${ENV_NAME}" >"$RESP_FILE" 2>"$ERR_FILE"; then
            GH_EXIT=0
          else
            GH_EXIT=$?
          fi
          HTTP_STATUS=$(head -n1 "$RESP_FILE" | tr -d '\r' | sed -nE 's#^HTTP/[0-9.]+ ([0-9]{3}).*#\1#p')
          if [ -z "$HTTP_STATUS" ]; then
            # Fallback when the status line is missing (connection-stage failure or --include format change): take it from gh's error message; if neither works leave empty and treat as "no HTTP response".
            HTTP_STATUS=$(sed -nE 's#.*\(HTTP ([0-9]{3})\).*#\1#p' "$ERR_FILE" | head -n1)
          fi
          # Body = everything after the blank line separating headers.
          RESP_BODY=$(tr -d '\r' < "$RESP_FILE" | awk 'in_body { print; next } /^$/ { in_body = 1 }')
          API_MESSAGE=$(printf '%s' "$RESP_BODY" | jq -r '.message? // empty' 2>/dev/null || true)
          echo "承認ゲート確認: GET environments/${ENV_NAME} → HTTP ${HTTP_STATUS:-不明}（gh 終了コード: ${GH_EXIT}）"
          if [ -n "$API_MESSAGE" ]; then
            echo "API メッセージ: ${API_MESSAGE}"
          fi
          if [ -s "$ERR_FILE" ]; then
            echo "gh の標準エラー出力:"
            cat "$ERR_FILE"
          fi

          case "${HTTP_STATUS:-}" in
            200)
              # Empty or non-object body is a parse error, not "unset" (jq -e exits non-zero on empty input).
              if ! printf '%s' "$RESP_BODY" | jq -e 'type == "object"' >/dev/null 2>&1 \
                || ! RULES=$(printf '%s' "$RESP_BODY" | jq -r '.protection_rules[]?.type'); then
                echo "::error::Environment '${ENV_NAME}' の応答（HTTP 200）を解析できませんでした（本文が空、または JSON オブジェクトではありません）。承認ゲートを確認できないため中断します。"
                exit 1
              fi
              if ! printf '%s\n' "$RULES" | grep -qx 'required_reviewers'; then
                CONFIGURED=$(printf '%s\n' "$RULES" | sed '/^$/d' | paste -sd, - || true)
                echo "::error::Environment '${ENV_NAME}' に Required reviewers が設定されていません（HTTP 200。設定済みの保護ルール: ${CONFIGURED:-なし}）。Settings → Environments で承認者を登録してから再実行してください。"
                exit 1
              fi
              ;;
            404)
              echo "::error::Environment '${ENV_NAME}' が存在しません（HTTP 404）。Settings → Environments で作成し、Required reviewers を設定してから再実行してください。"
              exit 1
              ;;
            403)
              echo "::error::Environment '${ENV_NAME}' の取得が拒否されました（HTTP 403: ${API_MESSAGE:-詳細なし}）。ワークフローの permissions に actions: read があるか、API レート制限に掛かっていないかを確認してください。"
              exit 1
              ;;
            "")
              echo "::error::Environment '${ENV_NAME}' の取得に失敗しました（HTTP 応答なし。gh 終了コード: ${GH_EXIT}）。ネットワーク障害などの可能性があります。時間をおいて再実行してください。"
              exit 1
              ;;
            *)
              echo "::error::Environment '${ENV_NAME}' の取得で想定外の応答がありました（HTTP ${HTTP_STATUS}: ${API_MESSAGE:-詳細なし}）。承認ゲートを確認できないため中断します。"
              exit 1
              ;;
          esac
          echo "承認ゲート（Required reviewers）を確認しました。"

      # Check out release to detect duplicate tags (fetch tags too).
      - name: Checkout release branch with tags
        if: ${{ steps.extract.outputs.skip != 'true' }}
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      # Fix the release target SHA. Tagging this SHA keeps a release branch that advances during approval from tagging an unintended commit. Manual runs are for re-running after the release PR is merged: verify release HEAD is the merge commit of a merged "リリース X.Y.Z" PR (head = main of the same repo). Before merge HEAD is the previous release's merge commit (2 parents) and passes the squash check, so without this the new version would be tagged on the old tree. The PR number is reused for summary extraction.
      - name: 対象コミット SHA を確定
        id: target
        if: ${{ steps.extract.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          VERSION: ${{ steps.extract.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # Manual runs target the current release HEAD and verify it is a release PR merge commit.
            SHA=$(git rev-parse HEAD)
            # API errors fail (no tag if unverifiable). Fetch all closed PRs to release (--paginate) and pick the merged one whose merge commit equals HEAD; commits/{sha}/pulls is not used (it can return no PR for merge commits / commits off the default branch), nor the search API (index delay, rate limits). --paginate emits one array per page, so merge with jq -s. merge_commit_sha is removed from PR objects in newer REST versions (2026-03-10), so pin 2022-11-28.
            if ! RELEASE_PRS=$(gh api --paginate -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${GITHUB_REPOSITORY}/pulls?state=closed&base=release&per_page=100"); then
              echo "::error::release 向けのクローズ済み PR 一覧を取得できませんでした（上記の gh のエラーを参照）。検証できないためタグを付けずに中断します。"
              exit 1
            fi
            if ! PR_JSON=$(printf '%s' "$RELEASE_PRS" | jq -c -s --arg sha "$SHA" \
              '[add // [] | .[] | select(.base.ref == "release" and .merged_at != null and .merge_commit_sha == $sha)] | first // empty'); then
              echo "::error::release 向けの PR 一覧の応答を解析できませんでした。検証できないためタグを付けずに中断します。"
              exit 1
            fi
            if [ -z "$PR_JSON" ]; then
              echo "::error::release HEAD（${SHA}）はマージ済みのリリース PR のマージコミットではありません。手動実行はリリース PR「リリース ${VERSION}」をマージした後の再実行専用です（リリース PR のマージ前に実行していないか確認してください）。"
              exit 1
            fi
            PR_NUMBER=$(printf '%s' "$PR_JSON" | jq -r '.number')
            PR_TITLE=$(printf '%s' "$PR_JSON" | jq -r '.title')
            PR_HEAD_REF=$(printf '%s' "$PR_JSON" | jq -r '.head.ref')
            # head.repo is null for a deleted fork; treat as another repository.
            PR_CROSS_REPO=$(printf '%s' "$PR_JSON" | jq -r --arg repo "$GITHUB_REPOSITORY" '((.head.repo.full_name // "") | ascii_downcase) != ($repo | ascii_downcase)')
            # Extract the version by the same rule as the pull_request path.
            PR_VERSION=""
            if printf '%s' "$PR_TITLE" | grep -Eq '^リリース[[:space:]　]'; then
              PR_VERSION=$(printf '%s' "$PR_TITLE" | sed -nE 's/^リリース[[:space:]　]+v?([0-9]+\.[0-9]+\.[0-9]+)([[:space:]　:：].*)?$/\1/p' | head -n1)
            fi
            if [ "$PR_VERSION" != "$VERSION" ]; then
              echo "::error::release HEAD（${SHA}）は PR #${PR_NUMBER}「${PR_TITLE}」のマージコミットであり、指定バージョン ${VERSION} のリリース PR ではありません。リリース PR「リリース ${VERSION}」のマージ後に実行してください。"
              exit 1
            fi
            if [ "$PR_HEAD_REF" != "main" ] || [ "$PR_CROSS_REPO" != "false" ]; then
              echo "::error::PR #${PR_NUMBER} の head が同一リポジトリの main ではありません（検出値: ${PR_HEAD_REF}、別リポジトリ: ${PR_CROSS_REPO}）。"
              exit 1
            fi
            echo "release HEAD は PR #${PR_NUMBER}「${PR_TITLE}」のマージコミットです。"
            echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          else
            # On PR merge use the fixed merge commit SHA (unaffected by release advancing during approval).
            SHA="$MERGE_SHA"
          fi
          if [ -z "$SHA" ]; then
            echo "::error::対象コミット SHA を決定できませんでした"
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "対象コミット: $SHA"

      # Squash detection: Squash / Rebase to release is prohibited; fail without tagging if the merge commit does not have 2 parents.
      - name: マージコミットの親数チェック（squash 検出）
        if: ${{ steps.extract.outputs.skip != 'true' }}
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          PARENT_COUNT=$(git rev-list --parents -n 1 "$TARGET_SHA" | wc -w)
          # Output is "<sha> <parent1> <parent2>...", so parents = words - 1.
          PARENT_COUNT=$((PARENT_COUNT - 1))
          echo "親コミット数: $PARENT_COUNT"
          if [ "$PARENT_COUNT" -ne 2 ]; then
            echo "::error::対象コミット $TARGET_SHA の親が ${PARENT_COUNT} 個です。release へのマージは merge commit（親2つ）で行ってください（Squash / Rebase 禁止）。"
            exit 1
          fi

      # Extract the release summary from the PR body (release-pr.yml wraps it in markers) into the Release notes. Failure (missing markers / PR not found) is not fatal: create the Release with auto-generated notes only.
      - name: リリースサマリーを PR 本文から抽出
        id: summary
        if: ${{ steps.extract.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Manual runs use the PR number verified when the target SHA was fixed.
          PR_NUMBER: ${{ github.event.pull_request.number || steps.target.outputs.pr_number }}
        run: |
          set -euo pipefail
          if [ -z "${PR_NUMBER:-}" ]; then
            echo "::warning::対象 PR を特定できませんでした。自動生成ノートのみで Release を作成します。"
            {
              echo "body<<RELEASE_SUMMARY_EOF"
              echo "RELEASE_SUMMARY_EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PR_BODY=$(gh pr view "$PR_NUMBER" --json body --jq .body)

          EXTRACTED=$(printf '%s\n' "$PR_BODY" | awk '
            /<!-- release-summary-start -->/ { capture=1; next }
            /<!-- release-summary-end -->/ { capture=0 }
            capture { print }
          ')

          if [ -z "$(printf '%s' "$EXTRACTED" | tr -d '[:space:]')" ]; then
            echo "::warning::PR #${PR_NUMBER} の本文にリリースサマリーマーカーが見つかりませんでした。"
          else
            echo "PR #${PR_NUMBER} からリリースサマリーを抽出しました。"
          fi

          {
            echo "body<<RELEASE_SUMMARY_EOF"
            printf '%s\n' "$EXTRACTED"
            echo "RELEASE_SUMMARY_EOF"
          } >> "$GITHUB_OUTPUT"

      # Duplicate tag check: fail if the tag exists, except on re-run after a partial failure where it already points at the target commit (the release job is idempotent).
      - name: タグ重複チェック
        if: ${{ steps.extract.outputs.skip != 'true' }}
        env:
          VERSION: ${{ steps.extract.outputs.version }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/REL-TAG-${VERSION}" >/dev/null; then
            EXISTING_SHA=$(git rev-list -n 1 "REL-TAG-${VERSION}^{commit}")
            if [ "$EXISTING_SHA" = "$TARGET_SHA" ]; then
              echo "::warning::タグ \`REL-TAG-${VERSION}\` は既に対象コミットを指しています。再実行として続行します。"
            else
              echo "::error::タグ \`REL-TAG-${VERSION}\` は既に別のコミットを指しています。バージョン番号を変更してください。"
              exit 1
            fi
          else
            echo "タグ \`REL-TAG-${VERSION}\` は未使用です。続行します。"
          fi

  # Release job with an approval gate (Required reviewers on the Environment).
  release:
    name: タグ作成と GitHub Release 公開
    runs-on: ubuntu-latest
    needs: validate
    # validate is skipped for non-release PRs; re-check the merged condition here as a fallback for skipped needs.
    if: ${{ (github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true) && needs.validate.outputs.skip != 'true' }}
    # Required reviewers on the GitHub Environment act as the approval gate. Do not set Deployment branches and tags restrictions: they would block pull_request / workflow_dispatch events before approval.
    environment:
      name: production-release
    steps:
      # Check out the SHA fixed by validate (not release HEAD).
      - name: Checkout target commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.target_sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Git ユーザー情報設定
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Git タグ作成と push
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          TARGET_SHA: ${{ needs.validate.outputs.target_sha }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/REL-TAG-${VERSION}" >/dev/null; then
            # Re-verify what an existing tag points to before reuse, so a tag manually pushed to another commit between validate and approval is not adopted silently.
            EXISTING_SHA=$(git rev-list -n 1 "REL-TAG-${VERSION}^{commit}")
            if [ "$EXISTING_SHA" != "$TARGET_SHA" ]; then
              echo "::error::タグ \`REL-TAG-${VERSION}\` は既に別のコミット（${EXISTING_SHA}）を指しています。対象コミットは ${TARGET_SHA} です。バージョン番号を変更するか、タグの指し先を確認してください。"
              exit 1
            fi
            echo "タグ \`REL-TAG-${VERSION}\` は既に対象コミットを指しているため再利用します。"
          else
            # Create an annotated tag on the fixed SHA (unaffected by release advancing during approval).
            git tag -a "REL-TAG-${VERSION}" -m "リリース ${VERSION}" "${TARGET_SHA}"
            git push origin "REL-TAG-${VERSION}"
          fi

      - name: GitHub Release を公開
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
          TARGET_SHA: ${{ needs.validate.outputs.target_sha }}
          SUMMARY: ${{ needs.validate.outputs.summary }}
        run: |
          set -euo pipefail
          # On re-run after a partial failure the Release already exists; skip creation.
          if gh release view "REL-TAG-${VERSION}" >/dev/null 2>&1; then
            echo "Release \`REL-TAG-${VERSION}\` は既に存在するため作成をスキップします。"
            exit 0
          fi
          # Start auto-generated notes from the previous REL-TAG-* tag: some generations have tags without Releases, so omitting previous_tag_name would generate notes for the whole history on first run. Use the latest tag reachable from the merge commit's first parent (main side); omit if none (whole history, first run only).
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'REL-TAG-*' "${TARGET_SHA}^1" 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            echo "自動生成ノートの起点: $PREV_TAG"
            AUTO_NOTES=$(gh api \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="REL-TAG-${VERSION}" \
              -f target_commitish="${TARGET_SHA}" \
              -f previous_tag_name="$PREV_TAG" \
              --jq .body)
          else
            echo "::warning::起点となる既存タグが無いため、全履歴分のノートを生成します。"
            AUTO_NOTES=$(gh api \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="REL-TAG-${VERSION}" \
              -f target_commitish="${TARGET_SHA}" \
              --jq .body)
          fi

          NOTES_FILE=$(mktemp)
          if [ -n "$(printf '%s' "$SUMMARY" | tr -d '[:space:]')" ]; then
            {
              printf '%s\n\n' "$SUMMARY"
              echo "---"
              echo ""
              printf '%s\n' "$AUTO_NOTES"
            } > "$NOTES_FILE"
          else
            printf '%s\n' "$AUTO_NOTES" > "$NOTES_FILE"
          fi

          # --target pins the release to the fixed commit.
          gh release create "REL-TAG-${VERSION}" \
            --target "${TARGET_SHA}" \
            --title "REL-TAG-${VERSION}" \
            --notes-file "$NOTES_FILE"

      - name: 成功サマリーを出力
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          TARGET_SHA: ${{ needs.validate.outputs.target_sha }}
        run: |
          set -euo pipefail
          {
            echo "## ✅ リリース ${VERSION} を公開しました"
            echo ""
            echo "- タグ: \`REL-TAG-${VERSION}\`"
            echo "- 対象コミット: \`${TARGET_SHA}\`"
            echo "- Release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/REL-TAG-${VERSION}"
            echo ""
            echo "タグ・Release の作成は冪等化してあるため、部分失敗時はワークフローを再実行してください。"
          } >> "$GITHUB_STEP_SUMMARY"
