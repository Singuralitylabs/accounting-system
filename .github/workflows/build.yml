name: Build Test

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "middleware.ts"
      - "next.config.js"
      - "tsconfig.json"
      - "package.json"
      - "yarn.lock"
  pull_request:
    paths:
      - "app/**"
      - "middleware.ts"
      - "next.config.js"
      - "tsconfig.json"
      - "package.json"
      - "yarn.lock"
  workflow_dispatch:
  # Reused by the release-PR quality gate (release-pr.yml).
  workflow_call:

jobs:
  build:
    name: next build
    runs-on: ubuntu-latest
    env:
      # Dummy values: only build viability is checked (all pages are force-dynamic, so no real connection at build time).
      NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Build
        run: yarn build
