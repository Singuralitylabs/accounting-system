name: Format Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Reused by the release-PR quality gate (release-pr.yml).
  workflow_call:

jobs:
  format-check:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Format check
        run: yarn format:check
